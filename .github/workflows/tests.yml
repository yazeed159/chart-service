name: Tests

# Runs the Python tests on every push and pull request. No network or real keys needed: the tests use
# fakes for Supabase/Polygon, and the dummy key below only satisfies config.py's startup check.
on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest flask-cors
      - name: Run tests
        env:
          POLYGON_API_KEY: test-key
        run: python -m pytest tests -q
